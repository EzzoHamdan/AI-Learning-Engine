name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the test run hermetic: no .env on the runner, and never reach a provider.
  LLM__DEFAULT_PROVIDER: ollama

jobs:
  quality:
    name: lint · types · tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app is developed on macOS and deployed on Linux; Windows is in the
        # matrix because the extraction and SQLite paths are the parts most
        # likely to break on it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix cheap: only Linux runs every interpreter.
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.12"}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -q

  app-boots:
    name: app boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # The suite deliberately never imports Streamlit, so nothing above would
      # catch a broken page or a bad st.* call at import time. This does.
      - name: Start Streamlit and wait for health
        run: |
          uv run streamlit run app.py \
            --server.port 8501 --server.headless true \
            > streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "app is healthy"; exit 0
            fi
            sleep 1
          done
          echo "app failed to become healthy"; cat streamlit.log; exit 1

      - name: Fail on tracebacks in the log
        run: |
          if grep -qE "Traceback|ModuleNotFoundError|ImportError" streamlit.log; then
            cat streamlit.log; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: streamlit-log
          path: streamlit.log

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: learning-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves the app
        run: |
          docker run -d --name le -p 8501:8501 learning-engine:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "container is healthy"; docker rm -f le; exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"; docker logs le; exit 1
