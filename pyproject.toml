[project]
name = "learning-engine"
version = "1.0.0"
description = "AI-powered interactive quiz and study-material generator built on Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49",
    "python-dotenv>=1.0",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "openai>=1.50",
    "requests>=2.32",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_engine"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
